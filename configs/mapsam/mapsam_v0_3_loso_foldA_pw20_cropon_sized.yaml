experiment_name: mapsam_v0_3_loso_foldA_pw20_cropon_sized

dataset:
  root: data/curated/datasets/mapsam_v02
  samples: metadata/training_samples.jsonl
  image_size: 1024
  num_workers: 2
  val_split: test
  train_sheets:
    - K-34-35-B-g
    - K-35-8-G-a
  eval_sheets:
    - K-35-51-B-a
  train_subsample: 51

model:
  model_type: vit_b
  sam_checkpoint: models/checkpoints/sam/sam_vit_b_01ec64.pth
  freeze_image_encoder: true
  train_prompt_encoder: false
  train_mask_decoder: true
  use_cached_embeddings: true

training:
  epochs: 50
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  device: cuda
  seed: 42
  save_every_epochs: 5
  validate_every_epochs: 5
  max_train_batches: null
  max_val_batches: null

loss:
  bce_weight: 0.5
  dice_weight: 2.0
  eps: 0.000001
  foreground_bce_pos_weight: 20.0
  use_bbox_loss_crop: true
  bbox_loss_crop_margin: 32

debug:
  overfit_mode: false
  log_prediction_stats: true

outputs:
  root: artifacts/models/mapsam/v0_3_loso_foldA_pw20_cropon_sized
  save_debug_predictions: true
  debug_prediction_count: 8
