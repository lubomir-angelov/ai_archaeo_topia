[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-archaeo-topia"
version = "0.1.0"
description = "SAM2-based auto-annotation of archaeological map images"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mcp>=1.20",
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "requests>=2.31",
    "uvicorn>=0.30",
    "PyYAML>=6.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]
# MapSAM segmentation (v0.1-v0.4). Already carries segment-anything and scipy,
# which the v0.5 end-to-end stage also needs: archeo_topia.analysis.mapsam_end_to_end
# spans both stages, so it requires `.[sam,detect]` together.
sam = [
    "torch>=2.0",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
    "opencv-python>=4.8",
    "scipy>=1.11",
    "tqdm>=4.66",
]
sam2 = [
    "torch>=2.0",
    "sam-2 @ git+https://github.com/facebookresearch/segment-anything-2.git",
    "opencv-python>=4.8",
]
# Mound *detection* (MapSAM v0.5 stage 1). Kept as a separate extra on purpose:
# Ultralytics is AGPL-3.0-or-commercial while this project is MIT, so the
# licence boundary is visible in the packaging and not only in prose. The
# decision to accept the AGPL dependency, and its conditions, are recorded in
# docs/mapsam/v005/PLAN.md. Nothing under the MIT library surface imports it.
detect = [
    "torch>=2.0",
    "ultralytics>=8.4",  # AGPL-3.0-or-commercial
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.scripts]
sam2-mcp = "services.sam2_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["services*", "services.*", "annotation_pipeline*", "archeo_topia*", "archeo_topia.*"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
