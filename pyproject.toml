[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvat-sam2-mcp"
version = "0.1.0"
description = "MCP server for CVAT + SAM2 GPU auto-annotation of archaeological map images"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20",
    "Pillow>=10.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[project.scripts]
cvat-sam2-mcp = "cvat_sam2_mcp.server:main"
sam2-mcp = "services.sam2_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cvat_sam2_mcp*", "services*", "services.*"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
